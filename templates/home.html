<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>HOME PAGE</h1>

{% if request.user.is_authenticated %}

    <h2>
        Welcome {{ request.user.email }}
    </h2>

    <a href="{% url 'profile' %}">
        Profile
    </a>

    <form action="{% url 'logout' %}" method="POST">

    {% csrf_token %}

    <button type="submit">
        Logout
    </button>

</form>

{% else %}

    <a href="{% url 'login'%}">
        Login
    </a>

    <a href="{% url 'register' %}">
        Register
    </a>

{% endif %}
</body>
</html>
