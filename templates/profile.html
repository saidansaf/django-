<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>
</head>
<body>
    <h1>Profile</h1>

<img src="{{ user.avatar.url }}" width="200">

<h2>{{ user.first_name }}</h2>

<h2>{{ user.last_name }}</h2>

<h2>{{ user.email }}</h2>

<h2>{{ user.phone_number }}</h2>

<form action="{% url 'logout' %}" method="POST">

    {% csrf_token %}

    <button type="submit">
        Logout
    </button>

</form>
</body>
</html>
