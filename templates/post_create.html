{% extends 'base.html' %}
{% load static %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
    :root {
        --bg: #0d0d0d;
        --card-bg: #141414;
        --card-border: #2a2a2a;
        --accent: #c8f135;
        --text: #f0f0f0;
        --muted: #888;
    }

    .create-wrapper {
        max-width: 700px;
        margin: 48px auto;
        padding: 0 24px;
    }

    .create-header {
        margin-bottom: 36px;
    }

    .create-header h1 {
        font-family: 'Syne', sans-serif;
        font-size: 2.2rem;
        font-weight: 800;
        color: #fff;
    }

    .create-header h1 span {
        color: var(--accent);
    }

    .form-group {
        margin-bottom: 24px;
    }

    .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--muted);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .form-input {
        width: 100%;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 14px 18px;
        color: var(--text);
        font-family: 'DM Sans', sans-serif;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
    }

    .form-input:focus {
        border-color: var(--accent);
    }

    textarea.form-input {
        resize: vertical;
        min-height: 200px;
    }

    .form-file-label {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--card-bg);
        border: 1px dashed var(--card-border);
        border-radius: 12px;
        padding: 20px 18px;
        cursor: pointer;
        color: var(--muted);
        font-size: 0.9rem;
        transition: border-color 0.2s;
    }

    .form-file-label:hover {
        border-color: var(--accent);
        color: var(--accent);
    }

    .form-file-label input {
        display: none;
    }

    .btn-submit {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--accent);
        color: #0d0d0d;
        font-family: 'DM Sans', sans-serif;
        font-weight: 700;
        font-size: 1rem;
        padding: 14px 32px;
        border-radius: 50px;
        border: none;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(200, 241, 53, 0.3);
    }

    .btn-cancel {
        display: inline-flex;
        align-items: center;
        background: transparent;
        color: var(--muted);
        font-family: 'DM Sans', sans-serif;
        font-weight: 500;
        font-size: 1rem;
        padding: 14px 24px;
        border-radius: 50px;
        border: 1px solid var(--card-border);
        cursor: pointer;
        text-decoration: none;
        transition: border-color 0.2s, color 0.2s;
    }

    .btn-cancel:hover {
        border-color: #555;
        color: #ccc;
    }

    .form-actions {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 32px;
    }
</style>

<div class="create-wrapper">
    <div class="create-header">
        <h1>Yangi <span>post</span></h1>
    </div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label>Sarlavha</label>
            <input type="text" name="title" class="form-input" placeholder="Post sarlavhasi..." required>
        </div>

        <div class="form-group">
            <label>Mazmun</label>
            <textarea name="content" class="form-input" placeholder="Post mazmuni..."></textarea>
        </div>

        <div class="form-group">
            <label>Rasm (ixtiyoriy)</label>
            <label class="form-file-label">
                <span>📎 Rasm tanlang</span>
                <input type="file" name="image" accept="image/*">
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-submit">✓ Saqlash</button>
            <a href="{% url 'post_list' %}" class="btn-cancel">Bekor qilish</a>
        </div>
    </form>
</div>
{% endblock %}
