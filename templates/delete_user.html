{% extends 'base.html' %}

{% block title %}
Delete User
{% endblock %}

{% block content %}

<div class="card">

    <h1>Delete User</h1>

    <p>
        Rostdan ham
        <b>{{ user.first_name }} {{ user.last_name }}</b>
        ni o'chirmoqchimisiz?
    </p>

    <br>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn-delete">
            Ha, o'chirish
        </button>

        <a href="{% url 'user_list' %}">
            <button type="button" class="btn-cancel">
                Cancel
            </button>
        </a>

    </form>

</div>

{% endblock %}
